name: Packagist

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - run: composer install --no-interaction
      - run: ./vendor/bin/phpunit

  packagist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Notify Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${PACKAGIST_USERNAME}" ] && [ -n "${PACKAGIST_TOKEN}" ]; then
            curl -fsSL -X POST \
              -H 'Content-Type: application/json' \
              "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
              -d '{"repository":{"url":"https://github.com/neresson/sveda-laravel-sdk"}}'
            exit 0
          fi
          echo "PACKAGIST_USERNAME/PACKAGIST_TOKEN unset; asking Packagist to crawl the GitHub repo."
          curl -fsSL -X POST \
            -H 'Content-Type: application/json' \
            'https://packagist.org/api/update-package' \
            -d '{"repository":{"url":"https://github.com/neresson/sveda-laravel-sdk"}}' \
            || true

      - name: Trigger sveda SDK compatibility matrix
        if: ${{ secrets.SVEDA_REPO_DISPATCH_TOKEN != '' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SVEDA_REPO_DISPATCH_TOKEN }}
          repository: neresson/sveda
          event-type: sdk-release
          client-payload: '{"sdk":"laravel","version":"${{ github.ref_name }}"}'
